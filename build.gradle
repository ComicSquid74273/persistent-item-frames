plugins {
    // MC 1.21.11 is an obfuscated version: use the main remapping plugin, not the
    // 'net.fabricmc.fabric-loom' no-remap alias (that one is for unobfuscated 26.x+ and
    // skips mappings/remapJar, which would compile against raw obf classes and ship no refmap).
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Dev-time named namespace = official Mojang names (the sources are written against them).
    mappings loom.officialMojangMappings()

    // modImplementation (not plain implementation): in the remap pipeline loom only reads the
    // loader jar's fabric-installer.json from mod configurations; it injects sponge-mixin/asm
    // (the org.spongepowered.asm.mixin compile classes) from there.
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    annotationProcessor "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
